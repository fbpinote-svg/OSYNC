<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img">
<title>ระบบ GameSync</title>
<desc>เครื่องแม่ต้นทางทำรายการไฟล์พร้อม hash แล้วแจกผ่าน HTTP เครื่องแม่ปลายทางเทียบรายการ ดึงเฉพาะไฟล์ที่เปลี่ยน ย้ายไฟล์ที่ถูกลบไป _ลบได้ แล้วรัน MASTER-Update-All</desc>
<style>
text{font-family:"Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif;text-anchor:middle;dominant-baseline:central}
.h{font-size:14px;font-weight:bold}
.s{font-size:12px}
.lbl{font-size:14px;font-weight:bold;fill:#2C2C2A}
.note{font-size:12px;fill:#5F5E5A}
.grp{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
.pu rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}.pu .h{fill:#3C3489}.pu .s{fill:#534AB7}
.gy rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}.gy .h{fill:#444441}.gy .s{fill:#5F5E5A}
.te rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}.te .h{fill:#085041}.te .s{fill:#0F6E56}
.arr{fill:none;stroke:#5F5E5A;stroke-width:1.5;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="440" rx="16" fill="#FFFFFF"/>
<rect class="grp" x="35" y="40" width="200" height="280" rx="12"/>
<rect class="grp" x="445" y="40" width="200" height="360" rx="12"/>
<text class="lbl" x="135" y="62">เครื่องแม่ต้นทาง</text>
<text class="lbl" x="545" y="62">เครื่องแม่ปลายทาง</text>
<g class="pu"><rect x="50" y="84" width="170" height="56" rx="8"/><text class="h" x="135" y="102">เกมอัปเดตเสร็จ</text><text class="s" x="135" y="122">launcher หรือวางไฟล์เอง</text></g>
<g class="pu"><rect x="50" y="164" width="170" height="56" rx="8"/><text class="h" x="135" y="182">ทำรายการไฟล์</text><text class="s" x="135" y="202">ชื่อ ขนาด hash</text></g>
<g class="pu"><rect x="50" y="244" width="170" height="56" rx="8"/><text class="h" x="135" y="262">ตัวแจกไฟล์</text><text class="s" x="135" y="282">HTTP อ่านอย่างเดียว</text></g>
<g class="gy"><rect x="262" y="244" width="156" height="56" rx="8"/><text class="h" x="340" y="262">เครือข่าย</text><text class="s" x="340" y="282">LAN หรือ Tailscale</text></g>
<g class="te"><rect x="460" y="84" width="170" height="56" rx="8"/><text class="h" x="545" y="102">เทียบรายการไฟล์</text><text class="s" x="545" y="122">หาไฟล์ที่เปลี่ยน</text></g>
<g class="te"><rect x="460" y="164" width="170" height="56" rx="8"/><text class="h" x="545" y="182">ดึงเฉพาะที่เปลี่ยน</text><text class="s" x="545" y="202">โหลดต่อได้ ตรวจ hash</text></g>
<g class="te"><rect x="460" y="244" width="170" height="56" rx="8"/><text class="h" x="545" y="262">ไฟล์ที่ต้นทางลบ</text><text class="s" x="545" y="282">ย้ายไป X:\_ลบได้</text></g>
<g class="te"><rect x="460" y="324" width="170" height="56" rx="8"/><text class="h" x="545" y="342">MASTER-Update-All</text><text class="s" x="545" y="362">เครื่องลูกรีบูตเห็นเกม</text></g>
<line class="arr" x1="135" y1="142" x2="135" y2="162"/>
<line class="arr" x1="135" y1="222" x2="135" y2="242"/>
<line class="arr" x1="222" y1="272" x2="260" y2="272"/>
<path class="arr" d="M420 272 L438 272 L438 112 L458 112"/>
<line class="arr" x1="545" y1="142" x2="545" y2="162"/>
<line class="arr" x1="545" y1="222" x2="545" y2="242"/>
<line class="arr" x1="545" y1="302" x2="545" y2="322"/>
<text class="note" x="135" y="350">ต้นทาง: GAMESYNC-Source.bat</text>
<text class="note" x="135" y="370">ปลายทาง: GAMESYNC-Pull.bat</text>
</svg>
