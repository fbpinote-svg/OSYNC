<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img">
<title>OSYNC ทำงานยังไง</title>
<desc>เครื่องแม่อัปเดตเกมและก๊อปข้อมูลติดตั้งขึ้นดิสก์เกมที่แชร์ เครื่องลูกดึงข้อมูลจากดิสก์นั้นไปใช้ตอนบูตและตอนกดเล่น</desc>
<style>
text{font-family:"Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif;text-anchor:middle;dominant-baseline:central}
.h{font-size:14px;font-weight:bold}
.s{font-size:12px}
.lbl{font-size:14px;font-weight:bold;fill:#2C2C2A}
.grp{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
.pu rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}.pu .h{fill:#3C3489}.pu .s{fill:#534AB7}
.gy rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}.gy .h{fill:#444441}.gy .s{fill:#5F5E5A}
.te rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}.te .h{fill:#085041}.te .s{fill:#0F6E56}
.arr{fill:none;stroke:#5F5E5A;stroke-width:1.5;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="350" rx="16" fill="#FFFFFF"/>
<rect class="grp" x="35" y="40" width="190" height="280" rx="12"/>
<rect class="grp" x="245" y="40" width="190" height="280" rx="12"/>
<rect class="grp" x="455" y="40" width="190" height="280" rx="12"/>
<text class="lbl" x="130" y="62">เครื่องแม่</text>
<text class="lbl" x="340" y="62">ดิสก์เกมที่แชร์</text>
<text class="lbl" x="550" y="62">เครื่องลูก</text>
<g class="pu"><rect x="50" y="84" width="160" height="56" rx="8"/><text class="h" x="130" y="102">Launcher 9 ค่าย</text><text class="s" x="130" y="122">เปิดค้าง อัปเดตเกมเอง</text></g>
<g class="pu"><rect x="50" y="164" width="160" height="56" rx="8"/><text class="h" x="130" y="182">Master-Watch</text><text class="s" x="130" y="202">เฝ้าทุก 1 นาที</text></g>
<g class="pu"><rect x="50" y="244" width="160" height="56" rx="8"/><text class="h" x="130" y="262">MASTER-Update-All</text><text class="s" x="130" y="282">ก๊อปข้อมูล + สแกนเกม</text></g>
<g class="gy"><rect x="260" y="84" width="160" height="56" rx="8"/><text class="h" x="340" y="102">ตัวเกม D: - J:</text><text class="s" x="340" y="122">ไฟล์เกมทั้งหมด</text></g>
<g class="gy"><rect x="260" y="164" width="160" height="56" rx="8"/><text class="h" x="340" y="182">games.json</text><text class="s" x="340" y="202">รายการเกมในเมนู</text></g>
<g class="gy"><rect x="260" y="244" width="160" height="56" rx="8"/><text class="h" x="340" y="262">ข้อมูลติดตั้ง</text><text class="s" x="340" y="282">Riot, EA, Epic, EAC</text></g>
<g class="te"><rect x="470" y="84" width="160" height="56" rx="8"/><text class="h" x="550" y="102">กดเล่นได้เลย</text><text class="s" x="550" y="122">ไม่ขึ้นซ่อม</text></g>
<g class="te"><rect x="470" y="164" width="160" height="56" rx="8"/><text class="h" x="550" y="182">เมนู 0JAYSHOP</text><text class="s" x="550" y="202">อ่าน games.json</text></g>
<g class="te"><rect x="470" y="244" width="160" height="56" rx="8"/><text class="h" x="550" y="262">งานตอนบูต</text><text class="s" x="550" y="282">ลงกันโกงที่ยังขาด</text></g>
<line class="arr" x1="130" y1="142" x2="130" y2="162"/>
<line class="arr" x1="130" y1="222" x2="130" y2="242"/>
<line class="arr" x1="212" y1="112" x2="258" y2="112"/>
<line class="arr" x1="212" y1="272" x2="258" y2="272"/>
<path class="arr" d="M212 272 L234 272 L234 192 L258 192"/>
<line class="arr" x1="422" y1="112" x2="468" y2="112"/>
<line class="arr" x1="422" y1="192" x2="468" y2="192"/>
<line class="arr" x1="422" y1="272" x2="468" y2="272"/>
<line class="arr" x1="550" y1="242" x2="550" y2="222"/>
<line class="arr" x1="550" y1="162" x2="550" y2="142"/>
</svg>
